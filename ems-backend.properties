# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_db
spring.datasource.username=saas_user
spring.datasource.password=pwd
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Schema is owned by Flyway (src/main/resources/db/migration) -- Hibernate only
# checks that the entities match it, and fails fast on any drift.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka discovery client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register under a resolvable name: the machine hostname (*.mshome.net, from the
# Hyper-V/WSL virtual adapter) is not resolvable by the gateway.
eureka.instance.hostname=localhost

spring.boot.message= hello emp service
