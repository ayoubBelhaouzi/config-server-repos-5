spring.datasource.url=jdbc:postgresql://localhost:5434/departement_db
spring.datasource.username=saas_user
spring.datasource.password=pwd
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register under a resolvable name: the machine hostname (*.mshome.net, from the
# Hyper-V/WSL virtual adapter) is not resolvable by the gateway.
eureka.instance.hostname=localhost

spring.boot.message= hello dept service 33
